[build]
  publish = "."

[[redirects]]
  from = "/reportar"
  to = "/reportar.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
